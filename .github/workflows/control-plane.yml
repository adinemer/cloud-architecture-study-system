name: control-plane

on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'aws/sap-c02/**'
      - 'schemas/**'
      - 'state/**'
      - 'sessions/**'
      - 'changes/**'
      - 'pipeline/**'
      - 'prompts/**'
      - 'qa/**'
      - '.github/workflows/pipeline-smoke.yml'
      - '.github/workflows/artifact-qa.yml'
      - '.github/workflows/control-plane.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'aws/sap-c02/**'
      - 'schemas/**'
      - 'state/**'
      - 'sessions/**'
      - 'changes/**'
      - 'pipeline/**'
      - 'prompts/**'
      - 'qa/**'
      - '.github/workflows/pipeline-smoke.yml'
      - '.github/workflows/artifact-qa.yml'
      - '.github/workflows/control-plane.yml'
  workflow_dispatch:

jobs:
  control-plane:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Install dependencies
        run: dnf -y install git python3 python3-pip
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trust checked-out repository for git metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create environment
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install 'jsonschema[format]'
      - name: Validate current extraction pipeline health
        run: |
          . .venv/bin/activate
          PYTHONPATH=qa python qa/validate_pipeline_health.py
      - name: Validate strict semantic extraction/enrichment controls
        run: |
          . .venv/bin/activate
          PYTHONPATH=qa python qa/validate_semantic_pipeline.py qa/fixtures/semantic-valid.json
          PYTHONPATH=qa python qa/semantic_pipeline_regression.py
      - name: Validate authoritative state and sessions
        run: |
          . .venv/bin/activate
          python qa/validate_control_plane.py
      - name: Validate ChatGPT chat-session contracts
        run: |
          . .venv/bin/activate
          python qa/validate_chat_sessions.py
      - name: Validate mandatory handoff continuity
        run: |
          . .venv/bin/activate
          PYTHONPATH=qa python qa/validate_handoffs.py
          PYTHONPATH=qa python qa/handoff_regression.py
      - name: Run governance negative regressions
        run: |
          . .venv/bin/activate
          PYTHONPATH=qa python qa/control_regression.py
      - name: Run final pre-study readiness static audit
        run: |
          . .venv/bin/activate
          python qa/readiness_audit.py
      - name: Validate change records
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.loads(Path('schemas/change-v1.schema.json').read_text())
          v=Draft202012Validator(schema,format_checker=FormatChecker())
          files=sorted(Path('changes').rglob('*.json')) if Path('changes').exists() else []
          for p in files:
              d=json.loads(p.read_text()); errs=list(v.iter_errors(d))
              assert not errs, (p,[e.message for e in errs])
          print(f'PASS change records ({len(files)})')
          PY
      - name: Run synthetic end-to-end semantic, study, chat, and handoff dry run
        run: |
          . .venv/bin/activate
          PYTHONPATH=qa python qa/end_to_end_dry_run.py
